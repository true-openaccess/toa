[package]
name = "toa-repo"
description = "TOA on disk and in git: reading object directories, and the operations of the standard."
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true

[features]
default = ["builtin-git"]
# gitoxide compiled in, used when the system git is missing or too old (docs/lines/tools.md 9)
builtin-git = ["dep:gix", "dep:reqwest"]

[dependencies]
toa-core.workspace = true
toa-types.workspace = true
gix = { version = "0.91", default-features = false, features = ["sha1", "blocking-http-transport-reqwest-rust-tls"], optional = true }
# the HTTP client gitoxide uses, to give it the user's proxy and certificates
reqwest = { version = "0.13", default-features = false, features = ["blocking"], optional = true }
serde_json.workspace = true
serde.workspace = true
