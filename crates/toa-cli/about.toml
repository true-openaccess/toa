# cargo-about: the notice of third-party licences shipped with each release of `toa`
# (THIRD-PARTY-LICENSES.txt, written by .github/workflows/tools-release.yml):
#
#   cargo about generate -c crates/toa-cli/about.toml -m crates/toa-cli/Cargo.toml \
#     crates/toa-cli/about.hbs -o THIRD-PARTY-LICENSES.txt
#
# A dependency under a licence not accepted below stops the release, so that a new licence is
# looked at before it ships.

accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Unicode-3.0",
    "Zlib",
    "CDLA-Permissive-2.0",
    "OpenSSL",
    "MPL-2.0",
]

# every platform a release is built for, so that the notice covers each package
targets = [
    "x86_64-unknown-linux-musl",
    "aarch64-unknown-linux-musl",
    "x86_64-pc-windows-msvc",
    "aarch64-apple-darwin",
    "x86_64-apple-darwin",
]

# only what is compiled into the executable
ignore-build-dependencies = true
ignore-dev-dependencies = true
