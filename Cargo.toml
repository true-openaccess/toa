[workspace]
resolver = "2"
members = [
    "crates/toa-core",
    "crates/toa-types",
    "crates/toa-repo",
    "crates/toa-cli",
    "tests",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.85"
license = "MIT"
repository = "https://github.com/true-openaccess/toa"
publish = false

[workspace.dependencies]
sha1-checked = { version = "0.10", default-features = false }
sha2 = { version = "0.10", default-features = false }
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order", "float_roundtrip"] }
toa-core = { path = "crates/toa-core" }
toa-types = { path = "crates/toa-types" }
toa-repo = { path = "crates/toa-repo", default-features = false }

# Small rather than fast: the tool waits on disks, git and the network, not on the CPU.
[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
